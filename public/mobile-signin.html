<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sign in to Foodlog</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root { --ink: #0a0a0a; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 22px; padding: 28px;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #0a0a0a; color: #fff; text-align: center;
    }
    .logo { width: 60px; height: 60px; border-radius: 16px; background: #1a1a1a;
      display: flex; align-items: center; justify-content: center; gap: 5px; }
    .logo i { width: 9px; height: 9px; border-radius: 50%; background: #fff; display: inline-block; }
    h1 { font-size: 24px; margin: 0; font-weight: 800; letter-spacing: -.02em; }
    p { margin: 0; opacity: .6; font-size: 14px; max-width: 320px; }
    .card { background: #fff; border-radius: 16px; padding: 22px; width: 100%; max-width: 340px; }
    #buttonWrap { display: flex; justify-content: center; min-height: 44px; }
    .msg { color: var(--ink); font-size: 14px; margin-top: 14px; min-height: 20px; }
    .spinner { width: 26px; height: 26px; border: 3px solid #dcdcd8; border-top-color: var(--ink);
      border-radius: 50%; animation: spin .8s linear infinite; margin: 12px auto 0; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .foot { opacity: .4; font-size: 12px; }
  </style>
</head>
<body>
  <div class="logo"><i></i><i></i><i></i></div>
  <h1>Sign in to Foodlog</h1>
  <p>Continue with Google to sync your daily nutrition to the app.</p>
  <div class="card">
    <div id="buttonWrap"></div>
    <div id="msg" class="msg"></div>
  </div>
  <p class="foot">&copy; 2026 Foodlog &middot; Daily nutrition, clearly.</p>

  <script>
    var CLIENT_ID = '355354020888-nmt0qlr55adgprvhaht50oamstv637qs.apps.googleusercontent.com';
    var msg = document.getElementById('msg');
    function setMsg(t) { msg.textContent = t || ''; }

    async function onCredential(response) {
      try {
        setMsg('Signing you in\u2026');
        document.getElementById('buttonWrap').innerHTML = '<div class="spinner"></div>';
        var res = await fetch('/api/auth/google', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ credential: response.credential })
        });
        if (!res.ok) throw new Error('auth failed');
        var d = await res.json();
        if (d.error) throw new Error(d.error);
        var p = new URLSearchParams();
        p.set('token', d.token || '');
        p.set('id', (d.user && d.user.id) || '');
        p.set('name', (d.user && d.user.name) || '');
        p.set('email', (d.user && d.user.email) || '');
        // Full user object (base64url JSON) so the app can hydrate the avatar too.
        try { p.set('user', btoa(unescape(encodeURIComponent(JSON.stringify(d.user || {}))))); } catch (e) {}
        // Hand the real Foodlog session token back to the native app.
        window.location.href = 'foodlog://auth#' + p.toString();
      } catch (e) {
        setMsg('Sign-in failed. Please try again.');
        renderButton();
      }
    }

    function renderButton() {
      if (!window.google || !google.accounts || !google.accounts.id) {
        setMsg('Loading Google\u2026');
        return setTimeout(renderButton, 400);
      }
      google.accounts.id.initialize({ client_id: CLIENT_ID, callback: onCredential, ux_mode: 'popup' });
      document.getElementById('buttonWrap').innerHTML = '';
      google.accounts.id.renderButton(document.getElementById('buttonWrap'),
        { theme: 'filled_black', size: 'large', text: 'continue_with', shape: 'pill', width: 280 });
      google.accounts.id.prompt();
    }

    window.addEventListener('load', function () { setTimeout(renderButton, 300); });
  </script>
</body>
</html>
