name: Build Foodlog iOS (.ipa)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'foodlog-rn/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA on macOS Xcode
    runs-on: macos-15
    defaults:
      run:
        working-directory: foodlog-rn

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate native iOS project (Expo Prebuild)
        run: npx expo prebuild --platform ios --clean
        env:
          EXPO_NO_GIT_STATUS: 1

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build Unsigned Release .app via Xcode
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package Payload into foodlog-ios.ipa
        run: |
          mkdir -p ios/ipa/Payload
          cp -R ios/build/Build/Products/Release-iphoneos/*.app ios/ipa/Payload/
          cd ios/ipa
          zip -r -9 ../foodlog-ios.ipa Payload

      - name: Upload foodlog-ios.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: foodlog-ios-ipa
          path: foodlog-rn/ios/foodlog-ios.ipa
          retention-days: 90
